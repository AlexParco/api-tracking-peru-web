server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Astro estático con format:directory (/docs sirve /docs/index.html) y
    # trailingSlash:never. try_files cubre el archivo, el index del directorio,
    # y si no, el 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # trailingSlash:never — la barra final redirige (301) a la URL canónica sin
    # barra, así /docs/ no sirve un 200 duplicado de /docs. La regex no matchea la
    # raíz "/" (necesita ≥1 char antes de la barra) ni los assets /_astro/… (no
    # terminan en barra), así que sólo toca páginas con barra final sobrante.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Assets con hash en el nombre (_astro/…): cache larga e inmutable.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 404 propio de Astro (dist/404.html).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

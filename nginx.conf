server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Location RELATIVO en los redirects.
    #
    # nginx corre detrás de un proxy TLS, así que ve el request por http: al
    # construir un Location absoluto lo arma con ESE esquema y un
    # `https://…/docs/` terminaba saltando a `http://…/docs` antes de volver a
    # https. El salto en claro pasa desapercibido porque el navegador lo
    # recupera, pero en el canje del magic link —que redirige a una ruta con
    # barra final— es un salto en claro con la sesión recién abierta.
    #
    # Con esto el Location sale relativo ("/docs") y el navegador conserva el
    # esquema original. Es preferible a reconstruirlo con X-Forwarded-Proto:
    # no hay que confiar en una cabecera para algo que el navegador ya sabe.
    absolute_redirect off;

    # Compresión. Sin esto la portada viaja en 172 KB y con gzip baja a 28 KB;
    # /docs, de 165 KB a 22 KB. Es HTML muy repetitivo —tablas de estados, JSON-LD,
    # clases de Tailwind— así que comprime cerca del 85 %.
    #
    # `gzip_proxied any` NO es decorativo: el default es `off`, que significa "no
    # comprimir NADA que venga de un proxy", y nginx decide que un request es
    # proxied por la cabecera Via. Como acá corre detrás del proxy TLS (el mismo
    # motivo del absolute_redirect de arriba), con el default los clientes que
    # atraviesan el proxy se quedaban sin comprimir aun con `gzip on`.
    #
    # Brotli daría otro 5 % (22 KB → 18 KB en /docs) pero la imagen base
    # nginx:1.27-alpine no trae ngx_brotli: habría que compilarlo o cambiar de
    # imagen, y no compensa por ese margen.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;
    # text/html va SIEMPRE comprimido y no se declara: nginx lo rechaza en la
    # lista ("duplicate MIME type text/html") porque ya está incluido de fábrica.

    # Cabeceras de seguridad.
    #
    # OJO: `add_header` NO se hereda hacia un location que declare su propio
    # `add_header` — nginx reemplaza la lista entera en vez de sumarla. Por eso
    # están repetidas en `location /static/`, que sí declara el suyo. Si se
    # agrega otro location con add_header, hay que repetirlas ahí también.
    #
    # Sin CSP a propósito: la página carga Turnstile (challenges.cloudflare.com) y
    # Clarity (clarity.ms) con scripts inline, así que una política escrita a ojo
    # rompe el alta gratis. Va cuando estén mapeados todos los orígenes.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Astro estático con format:directory (/docs sirve /docs/index.html) y
    # trailingSlash:never. try_files cubre el archivo, el index del directorio,
    # y si no, el 404.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # trailingSlash:never — la barra final redirige (301) a la URL canónica sin
    # barra, así /docs/ no sirve un 200 duplicado de /docs. La regex no matchea la
    # raíz "/" (necesita ≥1 char antes de la barra) ni los assets /static/… (no
    # terminan en barra), así que sólo toca páginas con barra final sobrante.
    location ~ ^(.+)/$ {
        return 301 $1$is_args$args;
    }

    # Assets con hash en el nombre (static/…): cache larga e inmutable. El
    # nombre lo decide `build.assets` en astro.config.mjs, así que ESTA RUTA VIAJA
    # ACOPLADA a ese valor. Estuvo apuntando a `/_astro/` —el default de Astro—
    # mientras el build ya emitía en otra carpeta, y el location no matcheaba
    # nunca: la hoja de estilo de 61 KB, con hash de contenido en el nombre y por
    # lo tanto inmutable, se revalidaba en cada visita. Un mismatch así no rompe
    # nada, sólo deja de servir, por eso puede pasar desapercibido.
    #
    # Las cabeceras de seguridad están repetidas acá porque este location declara
    # su propio add_header y eso descarta las del server (ver el bloque de arriba).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }

    # 404 propio de Astro (dist/404.html).
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
